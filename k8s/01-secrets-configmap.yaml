apiVersion: v1
kind: Secret
metadata:
  name: medcloud-secrets
type: Opaque
stringData:
  DB_USER: "medadmin"
  DB_PASSWORD: "medcloud123"
  MINIO_ROOT_USER: "minioadmin"
  MINIO_ROOT_PASSWORD: "minioadmin123"
  RABBITMQ_USER: "medadmin"
  RABBITMQ_PASS: "medcloud123"
  RABBITMQ_URL: "amqp://medadmin:medcloud123@rabbitmq:5672"
  AWS_ACCESS_KEY_ID: "local"
  AWS_SECRET_ACCESS_KEY: "local"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: medcloud-config
data:
  PORT: "3000"
  AWS_REGION: "us-east-1"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "medcloud"
  DB_SSL: "false"
  S3_BUCKET: "medcloud-exames"
  S3_ENDPOINT: "http://minio:9000"
  S3_PUBLIC_ENDPOINT: "http://localhost:30900"
  RABBITMQ_QUEUE: "medcloud.exames.processamento"
  REDIS_URL: "redis://redis:6379"
  CACHE_TTL: "60"
  DYNAMO_TABLE: "medcloud-audit"
  DYNAMO_ENDPOINT: "http://dynamodb:8000"

