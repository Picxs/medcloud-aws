server {
    listen 80;
    server_name _;

    # Permite upload de imagens de exames médicos de até 30MB
    client_max_body_size 30M;

    # DNS interno do Docker para resolver dinamicamente o IP do container backend
    resolver 127.0.0.11 valid=5s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # Arquivos estáticos do Frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy reverso para o container do Backend (API REST)
    location /api/ {
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
